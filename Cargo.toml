[package]
name = "tantivy-eml-dump"
version = "0.1.0"
edition = "2024"
license = "MIT"


[dependencies]
tantivy = { version = "0.25.0", features = ["quickwit", "zstd-compression"] }
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["derive", "env"] }
tokio = { version = "1.52.1", features = ["full"] }
native_db = "0.8.2"
itertools = "0.14.0"
native_model = "0.4.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1